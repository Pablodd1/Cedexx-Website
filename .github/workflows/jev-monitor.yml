name: Jev Web Error Monitor

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  audit:
    name: Jev System-1 Route Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Jev audit
        env:
          BASE_URL: ${{ vars.JEV_BASE_URL || 'https://www.cedexx.net' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ vars.JEV_NOTIFICATION_EMAIL || 'jasmelacosta@gmail.com' }}
          NOTIFY_WEBHOOK: ${{ secrets.JEV_NOTIFY_WEBHOOK }}
          JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-1.13.0' }}
        run: node scripts/jev-audit.mjs

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-audit-log
          path: jev-audit-*.json
          if-no-files-found: ignore
